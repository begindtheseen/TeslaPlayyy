# Production stack: the app + Caddy (automatic HTTPS). Host networking so the app can use the
# server's whole IPv6 /64 as source addresses (EGRESS_IPV6_PREFIX) and Caddy can bind 80/443.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ..
    network_mode: host
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      PORT: "3000"
      TRUST_PROXY: "1"            # client IPs come from Caddy's X-Forwarded-For
      YTDLP_UPDATE_ON_START: "1"  # restart the container to pick up yt-dlp fixes
    # Listen on loopback only; Caddy is the public entry point.
    command: ["node_modules/.bin/next", "start", "-H", "127.0.0.1", "-p", "3000"]

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
